<!doctype html>
<!-- Icon rasterization sheet for scripts/build PWA icons. Open in Chrome and
     screenshot each figure at its exact pixel size. -->
<html>
<head><style>body{margin:0;background:transparent}figure{margin:0;display:inline-block}img{display:block}</style></head>
<body>
  <figure data-name="icon-192"><img src="../../icons/logo.svg" style="width:192px;height:192px"></figure>
  <figure data-name="icon-512"><img src="../../icons/logo.svg" style="width:512px;height:512px"></figure>
  <figure data-name="maskable-512"><img src="../../icons/maskable.svg" style="width:512px;height:512px"></figure>
  <figure data-name="apple-touch-icon"><img src="../../icons/maskable.svg" style="width:180px;height:180px"></figure>
</body>
</html>
